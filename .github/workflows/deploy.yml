name: Deploy to Cloudflare

# Auto-deploy on merge to main. Requires one repo secret: CLOUDFLARE_API_TOKEN
# (create it from the "Edit Cloudflare Workers" API token template). The account
# is set via account_id in wrangler.jsonc.
#
# NOTE: before enabling this, disconnect the older Workers Builds Git connection
# in the Cloudflare dashboard, so the two don't both try to deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
